# Syncs secret/auction/client in Vault into the Kubernetes Secret "auction-client-secrets", which the chart reads with
# --set client.existingSecret=auction-client-secrets. Apply to the app namespace:
#   kubectl -n auction apply -f infra/k8s/secrets/client-secrets.yaml
#
# ESO logs in to Vault as ServiceAccount "vault-reader" (role "auction", read-only on secret/auction/*), so no Vault
# token is stored in the cluster. infra/k8s/secrets/vault-local.sh sets up the Vault side.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200 # for a real Vault: its https URL, plus caProvider or caBundle
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: auction
          serviceAccountRef:
            name: vault-reader
            audiences: [ vault ] # must match the role's audience
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auction-client-secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: auction-client-secrets
    creationPolicy: Owner
  dataFrom:
    # Every key under secret/auction/client becomes a key of the Secret, and so an env var in the client pods.
    - extract:
        key: auction/client
