{{- if .Values.client.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aeron-auction.client.name" . }}
  labels:
    {{- include "aeron-auction.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
  {{- with .Values.client.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.client.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.client.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.client.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- if $.Values.centrifugo.enabled }}
          # Centrifugo's WebSocket, so browsers connect on the same host as the page.
          - path: /connection
            pathType: Prefix
            backend:
              service:
                name: {{ include "aeron-auction.centrifugo.name" $ }}
                port:
                  name: http
          {{- end }}
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "aeron-auction.client.name" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
