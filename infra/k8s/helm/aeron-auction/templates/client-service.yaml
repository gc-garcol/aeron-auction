apiVersion: v1
kind: Service
metadata:
  name: {{ include "aeron-auction.client.name" . }}
  labels:
    {{- include "aeron-auction.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  type: {{ .Values.client.service.type }}
  selector:
    {{- include "aeron-auction.client.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.client.service.port }}
      targetPort: http
      protocol: TCP
