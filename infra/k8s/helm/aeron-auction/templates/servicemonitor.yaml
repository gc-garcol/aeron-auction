{{- if .Values.metrics.serviceMonitor.enabled }}
{{- range $component := list "cluster" "client" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ printf "%s-%s" (include "aeron-auction.fullname" $) $component }}
  labels:
    {{- include "aeron-auction.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    {{- with $.Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include (printf "aeron-auction.%s.selectorLabels" $component) $ | nindent 6 }}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: {{ $.Values.metrics.serviceMonitor.interval }}
{{- end }}
{{- end }}
