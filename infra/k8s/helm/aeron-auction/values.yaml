# Kubernetes DNS suffix. Cluster members reach each other by <pod>.<headless-svc>.<ns>.svc.<clusterDomain>.
clusterDomain: cluster.local

imagePullSecrets: []

cluster:
  # Number of cluster members. Must be odd. Don't change it for an existing log: the member list is static,
  # and adding or removing members needs Aeron's dynamic join / ClusterTool, not a scale.
  replicas: 3

  image:
    repository: aeron-auction/cluster
    tag: "" # defaults to the chart's appVersion
    pullPolicy: IfNotPresent

  # Matches the Dockerfile's ENTRYPOINT; NODE_ID is taken from the pod ordinal before Java starts.
  javaOpts: "--add-opens java.base/jdk.internal.misc=ALL-UNNAMED"
  # JVM memory flags. The heap plus /dev/shm (counted as memory) must stay under resources.limits.memory.
  javaToolOptions: "-XX:MaxRAMPercentage=35 -XX:+ExitOnOutOfMemoryError"
  # Garbage collector, put before javaToolOptions. ZGC keeps pauses under a millisecond, so a GC doesn't delay
  # heartbeats or the replicated log. Set "" to use the JVM's default (G1).
  gcOpts: "-XX:+UseZGC"

  ports:
    http: 9100 # actuator: health and prometheus
    ingress: 9002
    consensus: 9003
    log: 9004
    catchup: 9005
    read: 9006
    archive: 8010

  # Size of /dev/shm, a memory-backed emptyDir. The Docker default of 64MB is too small for Aeron's log buffers.
  shmSize: 1Gi

  persistence:
    size: 10Gi
    storageClass: "" # "" uses the cluster's default StorageClass
    accessModes: [ ReadWriteOnce ]

  resources:
    requests:
      cpu: "1"
      memory: 3Gi
    limits:
      memory: 3Gi

  # Waits this long after a pod is ready before the rolling update moves to the next member.
  minReadySeconds: 15
  terminationGracePeriodSeconds: 30

  # "hard" puts every member on a different Kubernetes node; needs at least 3 schedulable nodes.
  # "soft" prefers it but still schedules on fewer nodes.
  podAntiAffinity: hard

  pdb:
    enabled: true
    maxUnavailable: 1 # keeps a quorum of 2 out of 3 through voluntary disruptions

  extraEnv: []
  # Name of a Secret in the release namespace whose keys become env vars, e.g. one that External Secrets Operator
  # syncs from Vault. The chart never creates it. The pods don't start until it exists.
  existingSecret: ""
  nodeSelector: {}
  tolerations: []
  podAnnotations: {}

client:
  replicas: 2

  image:
    repository: aeron-auction/client
    tag: ""
    pullPolicy: IfNotPresent

  javaToolOptions: "-XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError"

  ports:
    http: 8080
    readReply: 9007

  shmSize: 256Mi

  # Sends reads through the replicated log instead of the leader's read channel.
  readsThroughLog: false
  rpcTimeoutMs: 2000

  resources:
    requests:
      cpu: 500m
      memory: 1536Mi
    limits:
      memory: 1536Mi

  terminationGracePeriodSeconds: 30
  # "soft" spreads the pods over Kubernetes nodes when it can; "hard" requires it.
  podAntiAffinity: soft

  pdb:
    enabled: true
    minAvailable: 1

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: auction.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  extraEnv: []
  # Same as cluster.existingSecret.
  existingSecret: ""
  nodeSelector: {}
  tolerations: []
  podAnnotations: {}

centrifugo:
  # Pushes live updates to the web UI over WebSocket, as binary protobuf frames. Each client pod publishes the writes
  # it handled through Centrifugo's server API. true runs Centrifugo in this release. To use one in its own namespace,
  # set false and external.apiUrl (see values-centrifugo-external.yaml). With neither, the web UI polls.
  enabled: true

  external:
    # Server API of a Centrifugo outside this release, such as
    # http://centrifugo-internal.centrifugo.svc.cluster.local:9000/api. Only used while enabled is false.
    apiUrl: ""

  image:
    repository: centrifugo/centrifugo
    tag: v6.10.2
    pullPolicy: IfNotPresent

  # Required while enabled or external.apiUrl is set. A Secret in the release namespace with the key
  # CENTRIFUGO_HTTP_API_KEY, which the client reads to publish. While enabled, Centrifugo also reads
  # CENTRIFUGO_ADMIN_PASSWORD and CENTRIFUGO_ADMIN_SECRET from it. The chart never creates it.
  existingSecret: ""

  # Pages that may open a WebSocket. "*" allows any page, which is safe here because browsers can only subscribe to a
  # public feed. Narrow it, such as [ "https://auction.example.com" ], or set [] to use every client.ingress host.
  allowedOrigins: [ "*" ]
  # Where browsers connect, absolute or relative to the page. The relative default goes through the client's Ingress,
  # which routes /connection to Centrifugo.
  websocketUrl: /connection/websocket
  # Recent events per channel, so a browser that reconnects within historyTtl gets what it missed.
  historySize: 100
  historyTtl: 300s

  # History lives in memory, so there is one replica. More need Redis or NATS as Centrifugo's broker.
  replicas: 1

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

  nodeSelector: {}
  tolerations: []
  podAnnotations: {}

metrics:
  # Adds prometheus.io/* annotations to the pods.
  podAnnotations: true
  # Creates ServiceMonitors for the Prometheus Operator.
  serviceMonitor:
    enabled: false
    interval: 5s
    labels: {}
