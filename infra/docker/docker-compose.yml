name: aeron-auction

x-node: &node
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile.cluster
  image: aeron-auction/cluster
  shm_size: 1g # the default 64MB is too small for Aeron's log buffers
  restart: on-failure # a crashed node retries until Aeron accepts its old mark files as stale
  stop_grace_period: 20s

x-node-env: &node-env
  CLUSTER_MEMBERS: "0,node0:9002,node0:9003,node0:9004,node0:9005,node0:8010|1,node1:9002,node1:9003,node1:9004,node1:9005,node1:8010|2,node2:9002,node2:9003,node2:9004,node2:9005,node2:8010"
  CLUSTER_DIR: /data
  AERON_DIR: /dev/shm/aeron
  SERVER_PORT: "9100"

services:
  node0:
    <<: *node
    hostname: node0
    environment:
      <<: *node-env
      NODE_ID: "0"
      READ_ENDPOINT: node0:9006
    volumes:
      - node0-data:/data

  node1:
    <<: *node
    hostname: node1
    environment:
      <<: *node-env
      NODE_ID: "1"
      READ_ENDPOINT: node1:9006
    volumes:
      - node1-data:/data

  node2:
    <<: *node
    hostname: node2
    environment:
      <<: *node-env
      NODE_ID: "2"
      READ_ENDPOINT: node2:9006
    volumes:
      - node2-data:/data

  client:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.client
    image: aeron-auction/client
    hostname: client
    shm_size: 256m
    environment:
      AERON_DIR: /dev/shm/aeron
      INGRESS_ENDPOINTS: "0=node0:9002,1=node1:9002,2=node2:9002"
      EGRESS_HOST: client
      READ_ENDPOINTS: "0=node0:9006,1=node1:9006,2=node2:9006"
      READ_REPLY_ENDPOINT: client:9007
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_HTTP_API_KEY:-dev-api-key}
      CENTRIFUGO_WEBSOCKET_URL: ws://localhost:8000/connection/websocket # opened by the browser, not the client
    ports:
      - "8080:8080"
    depends_on:
      - node0
      - node1
      - node2
      - centrifugo

  centrifugo:
    extends:
      file: docker-compose.infra.yml
      service: centrifugo

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/auction.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  node0-data:
  node1-data:
  node2-data:
