spring:
  application:
    name: auction-client

server:
  port: ${SERVER_PORT:8080}

# The first three are required. The dev profile provides values for a one-node cluster on this machine.
auction:
  aeron-dir: ${AERON_DIR}
  ingress-endpoints: ${INGRESS_ENDPOINTS}
  egress-host: ${EGRESS_HOST}
  read-endpoints: ${READ_ENDPOINTS}
  read-reply-endpoint: ${READ_REPLY_ENDPOINT}
  reads-through-log: ${READS_THROUGH_LOG:false} # true sends reads through the replicated log, as they used to
  rpc-timeout-ms: ${RPC_TIMEOUT_MS:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
